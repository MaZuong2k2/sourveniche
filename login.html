    <form action="login" method="post" id="form_sg" >
        <label style="font-size: 50px;" class="align-self-center">Login</label>
        <label for="name" >Tên người dùng:</label> 
        <input type="text" name="name" placeholder="Nhập tên người dùng" minlength="6" maxlength="18" required> 

        <label for="name" >Mật khẩu:</label> 
        <input type="password" name="passw" placeholder="Nhập mật khẩu" minlength="6" maxlength="18" required>


        <label style="font-size: 13px;">Don't have an account? <a style="color:rgba(212,29,72);" href="./signup.html" >Sign up</a></label>
        <button style="border-color: rgb(56, 56, 56);" type="submit" class="btn btn-secondary fs-4 border-3 rounded-3">Log in</button>
    </form>
    
    <script>
        const form = document.getElementById("form_sg");

form.addEventListener("submit", function(event){

    if (!form.checkValidity()) {
        event.preventDefault();
        return;
    }

    event.preventDefault();

    window.location.href = "./home.html";
});
    </script>
